  <script>
(function(){
  var btns = document.querySelectorAll('.filter-btn');
  var grid = document.querySelector('.industry-index .entry-grid');
  var count = document.getElementById('filter-count');
  if(!btns.length || !grid) return;
  function applyFilter(group) {
    var cards = grid.querySelectorAll('.entry-card');
    var shown = 0;
    cards.forEach(function(card){
      var match = !group || card.getAttribute('data-group') === group;
      card.classList.toggle('hidden-by-filter', !match);
      if(match) shown++;
    });
    btns.forEach(function(b){
      b.classList.toggle('active', (b.getAttribute('data-group')||'') === (group||''));
    });
    if(count) count.textContent = shown > 0 ? shown + ' 篇' : '';
  }
  btns.forEach(function(btn){
    btn.addEventListener('click', function(){
      applyFilter(btn.getAttribute('data-group'));
    });
  });
  applyFilter('');
})();
  </script>
</body>
